name: Node.js CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 24]
      fail-fast: false

    continue-on-error: ${{ matrix.node-version == 24 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Check version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
