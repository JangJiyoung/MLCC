<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLCC 기억력 자가진단</title>
    <style>
        :root {
            --primary-color: #1A365D; /* 네이비 */
            --accent-color: #3182CE; /* 블루 */
            --bg-ivory: #FDFBF7;    /* 연한 아이보리 배경 */
            --card-bg: #FFFFFF;     /* 카드 흰색 */
        }

        body { 
            background-color: var(--bg-ivory);
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card { 
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            padding: 40px 25px;
            border-radius: 30px;
            /* 아이보리 배경에 어울리는 부드러운 그림자 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .header h2 { color: var(--primary-color); margin-bottom: 8px; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px; }
        .header p { color: #718096; font-size: 1rem; margin-bottom: 30px; }

        .progress-bar { width: 100%; height: 8px; background: #F1F1F1; border-radius: 10px; margin-bottom: 40px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-color); width: 0%; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #question-text { 
            font-size: 1.3rem; font-weight: 700; color: #2D3748; 
            line-height: 1.6; min-height: 100px; margin-bottom: 35px;
            display: flex; align-items: center; justify-content: center;
            word-break: keep-all; transition: opacity 0.2s;
        }
        
        .btn-group { display: flex; flex-direction: column; gap: 14px; }
        
        button.choice-btn { 
            padding: 20px; border: 1px solid #E2E8F0; border-radius: 18px; 
            font-size: 1.1rem; cursor: pointer; transition: all 0.2s; 
            font-weight: 700; background: #FFFFFF; color: #4A5568;
            outline: none;
        }

        /* 버튼 클릭/활성화 시 스타일 */
        button.choice-btn.active {
            background: var(--primary-color) !important;
            color: white !important;
            border-color: var(--primary-color) !important;
            transform: scale(0.97);
        }

        .footer-logo { 
            margin-top: 40px; padding-top: 25px;
            border-top: 1px solid #F1F1F1;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .logo-box {
            background: var(--primary-color); padding: 5px 12px; border-radius: 6px;
            color: white; font-weight: 900; font-size: 1.1rem; letter-spacing: 1px;
        }
        .logo-subtext { font-size: 0.95rem; font-weight: 700; color: var(--primary-color); opacity: 0.9; }

        #result-area { display: none; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .score-display { font-size: 4.5rem; font-weight: 900; color: var(--accent-color); margin: 20px 0; }
        #result-msg { font-size: 1.1rem; line-height: 1.7; color: #4A5568; margin-bottom: 35px; word-break: keep-all; }
        
        .retry-btn {
            width: 100%; background: #2D3748; color: white; padding: 18px; 
            border-radius: 15px; border: none; cursor: pointer; font-weight: 700; font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 설문 영역 -->
    <div id="survey-area">
        <div class="header">
            <h2>기억력 자가진단</h2>
            <p>세미나 시작 전 나의 뇌 건강 상태</p>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="question-text"></div>
        <div class="btn-group">
            <button class="choice-btn" id="btn-yes" onclick="handleAnswer(1, 'btn-yes')">네, 그렇습니다</button>
            <button class="choice-btn" id="btn-no" onclick="handleAnswer(0, 'btn-no')">아니오, 아닙니다</button>
        </div>
    </div>

    <!-- 결과 영역 -->
    <div id="result-area">
        <div class="header"><h2>나의 뇌 건강 점수</h2></div>
        <div class="score-display" id="final-score">100점</div>
        <p id="result-msg"></p>
        <button class="retry-btn" onclick="location.reload()">다시 테스트하기</button>
    </div>

    <!-- 로고 영역 -->
    <div class="footer-logo">
        <div class="logo-box">MLCC</div>
        <div class="logo-subtext">마인드 셋 라이프 코칭센터</div>
    </div>
</div>

<script>
    const questions = [
        "1. 물건을 어디 뒀는지 몰라 5분 이상 찾은 적이 일주일에 3회 이상인가요?",
        "2. 아는 사람의 이름이 입가에서만 맴돌고 선뜻 나오지 않나요?",
        "3. 분명히 할 일이 있어 방에 들어갔는데, '내가 왜 왔지?' 하며 멍해진 적이 있나요?",
        "4. 통화 중인데 내 휴대폰이 어디 있나 찾은 적이 있나요?",
        "5. 오늘 점심에 드신 메뉴 3가지를 3초 안에 떠올리기 힘드신가요?",
        "6. 며칠 전에 나눈 대화 내용이 기억나지 않아 당황한 적이 있나요?",
        "7. 가스불을 껐는지, 현관문을 잠갔는지 몰라 다시 확인하러 가시나요?",
        "8. 예전에 비해 새로운 정보를 습득하는 속도가 느려졌다고 느끼나요?",
        "9. 단어가 생각나지 않아 '그거 있잖아' 같은 표현을 자주 쓰시나요?",
        "10. 스마트폰 없이는 가족 전화번호 3개 이상 외우기 힘드신가요?"
    ];

    let currentIndex = 0;
    let totalScore = 100; // 100점에서 시작 (감점 방식)

    function updateUI() {
        const qText = document.getElementById('question-text');
        const progress = document.getElementById('progress');
        
        document.querySelectorAll('.choice-btn').forEach(btn => btn.classList.remove('active'));

        if (currentIndex < questions.length) {
            qText.innerText = questions[currentIndex];
            progress.style.width = ((currentIndex + 1) / questions.length * 100) + "%";
        } else {
            showResult();
        }
    }

    function handleAnswer(value, btnId) {
        document.getElementById(btnId).classList.add('active');
        
        // '네'를 선택하면 10점 감점
        if (value === 1) {
            totalScore -= 10;
        }
        
        currentIndex++;

        setTimeout(() => {
            const qArea = document.getElementById('question-text');
            qArea.style.opacity = 0;
            setTimeout(() => {
                updateUI();
                qArea.style.opacity = 1;
            }, 150);
        }, 300);
    }

    function showResult() {
        document.getElementById('survey-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        
        document.getElementById('final-score').innerText = totalScore + "점";
        const msg = document.getElementById('result-msg');
        
        // 점수 구간별 결과 로직
        if (totalScore >= 80) {
            msg.innerHTML = "<strong>[양호] 뇌 건강이 아주 좋습니다!</strong><br>현재의 인지 능력을 잘 유지하고 계시네요. 오늘 배울 기술을 통해 당신의 기억력을 '강력한 무기'로 만드세요.";
        } else if (totalScore > 60) {
            msg.innerHTML = "<strong>[주의] 건망증 관리 단계입니다.</strong><br>집중력이 흐트러지기 쉬운 상태입니다. 간단한 훈련과 습관 변화만으로도 충분히 회복할 수 있습니다.";
        } else {
            msg.innerHTML = "<strong>[위험] 뇌 피로도가 매우 높습니다.</strong><br>건망증 증상이 심화된 상태입니다. 오늘 세미나에서 제안하는 '메모리 디톡스'와 '기억 구조화'가 시급합니다.";
        }
    }

    updateUI();
</script>

</body>
</html>
