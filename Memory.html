<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLCC 기억력 자가진단</title>
    <style>
        :root {
            --primary-color: #1A365D; /* 곤색 (네이비) */
            --accent-color: #3182CE;
            --bg-overlay: rgba(247, 250, 252, 0.9);
        }

        body { 
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images.unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card { 
            background: white;
            width: 92%;
            max-width: 460px;
            padding: 45px 30px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .header h2 { color: var(--primary-color); margin-bottom: 8px; font-size: 1.7rem; font-weight: 800; }
        .header p { color: #4A5568; font-size: 1rem; margin-bottom: 30px; }

        .progress-bar { width: 100%; height: 8px; background: #E2E8F0; border-radius: 10px; margin-bottom: 40px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-color); width: 0%; transition: 0.5s ease; }
        
        #question-text { 
            font-size: 1.35rem; font-weight: 700; color: #2D3748; 
            line-height: 1.6; min-height: 110px; margin-bottom: 35px;
            display: flex; align-items: center; justify-content: center;
            word-break: keep-all; transition: opacity 0.2s;
        }
        
        .btn-group { display: flex; flex-direction: column; gap: 14px; }
        
        /* 기본 버튼 스타일: 연한 배경색 */
        button.choice-btn { 
            padding: 18px; border: 1px solid #E2E8F0; border-radius: 18px; 
            font-size: 1.15rem; cursor: pointer; transition: all 0.2s; 
            font-weight: 700; background: #F7FAFC; color: #718096;
        }

        /* 클릭 시 곤색으로 변경되는 클래스 */
        button.choice-btn.active {
            background: var(--primary-color) !important;
            color: white !important;
            border-color: var(--primary-color) !important;
            transform: scale(0.98);
        }

        .footer-logo { 
            margin-top: 45px; padding-top: 25px;
            border-top: 2px solid #F1F5F9;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .logo-box {
            background: var(--primary-color); padding: 6px 14px; border-radius: 8px;
            color: white; font-weight: 900; font-size: 1.2rem; letter-spacing: 1px;
        }
        .logo-subtext { font-size: 1.05rem; font-weight: 800; color: var(--primary-color); }

        #result-area { display: none; }
        .score-display { font-size: 4rem; font-weight: 900; color: var(--accent-color); margin: 25px 0; }
        #result-msg { font-size: 1.1rem; line-height: 1.8; color: #4A5568; margin-bottom: 35px; word-break: keep-all; }
    </style>
</head>
<body>

<div class="card">
    <div id="survey-area">
        <div class="header">
            <h2>기억력 자가진단</h2>
            <p>세미나 시작 전 나의 뇌 건강 상태</p>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div id="question-text">질문을 불러오는 중...</div>
        <div class="btn-group">
            <button class="choice-btn" id="btn-yes" onclick="handleAnswer(1, 'btn-yes')">네, 그렇습니다</button>
            <button class="choice-btn" id="btn-no" onclick="handleAnswer(0, 'btn-no')">아니오, 아닙니다</button>
        </div>
    </div>

    <div id="result-area">
        <div class="header"><h2>나의 뇌 건강 점수</h2></div>
        <div class="score-display" id="final-score">0점</div>
        <p id="result-msg"></p>
        <button onclick="location.reload()" style="width:100%; background:#2D3748; color:white; padding:15px; border-radius:12px; border:none; cursor:pointer; font-weight:700;">다시 테스트하기</button>
    </div>

    <div class="footer-logo">
        <div class="logo-box">MLCC</div>
        <div class="logo-subtext">마인드 셋 라이프 코칭센터</div>
    </div>
</div>

<script>
    const questions = [
        "1. 물건을 어디 뒀는지 몰라 5분 이상 찾은 적이 일주일에 3회 이상인가요?",
        "2. 아는 사람의 이름이 입가에서만 맴돌고 선뜻 나오지 않나요?",
        "3. 분명히 할 일이 있어 방에 들어갔는데, '내가 왜 왔지?' 하며 멍해진 적이 있나요?",
        "4. 통화 중인데 내 휴대폰이 어디 있나 찾은 적이 있나요?",
        "5. 오늘 점심에 드신 메뉴 3가지를 3초 안에 떠올리기 힘드신가요?",
        "6. 며칠 전에 나눈 대화 내용이 기억나지 않아 당황한 적이 있나요?",
        "7. 가스불을 껐는지, 현관문을 잠갔는지 몰라 다시 확인하러 간 적이 있나요?",
        "8. 예전에 비해 새로운 정보를 습득하는 속도가 느려졌다고 느끼나요?",
        "9. 단어가 생각나지 않아 '그거 있잖아' 같은 표현을 자주 쓰시나요?",
        "10. 스마트폰 없이는 가족 전화번호 3개 이상 외우기 힘드신가요?"
    ];

    let currentIndex = 0;
    let totalScore = 0;

    function updateUI() {
        const qText = document.getElementById('question-text');
        const progress = document.getElementById('progress');
        
        // 버튼 상태 초기화
        document.getElementById('btn-yes').classList.remove('active');
        document.getElementById('btn-no').classList.remove('active');

        if (currentIndex < questions.length) {
            qText.innerText = questions[currentIndex];
            progress.style.width = (currentIndex / questions.length * 100) + "%";
        } else {
            showResult();
        }
    }

    function handleAnswer(value, btnId) {
        // 선택한 버튼 곤색으로 변경
        document.getElementById(btnId).classList.add('active');
        totalScore += value;
        currentIndex++;

        // 0.3초 후 다음 질문으로 이동 (시각적 확인을 위해)
        setTimeout(() => {
            const qText = document.getElementById('question-text');
            qText.style.opacity = 0;
            
            setTimeout(() => {
                updateUI();
                qText.style.opacity = 1;
            }, 150);
        }, 300);
    }

    function showResult() {
        document.getElementById('survey-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        const score = totalScore * 10;
        document.getElementById('final-score').innerText = score + "점";
        
        const msg = document.getElementById('result-msg');
        if (score >= 70) {
            msg.innerHTML = "<strong>[주의]</strong> 현재 뇌의 피로도가 매우 높습니다.<br>오늘 세미나에서 제안하는 '메모리 디톡스'가 필요합니다.";
        } else if (score >= 40) {
            msg.innerHTML = "<strong>[관리]</strong> 경미한 건망증 단계입니다.<br>기억의 구조화 습관을 통해 충분히 개선할 수 있습니다.";
        } else {
            msg.innerHTML = "<strong>[양호]</strong> 뇌 건강이 아주 좋습니다!<br>오늘 배울 기술을 통해 기억력을 '무기'로 만드세요.";
        }
    }

    updateUI();
</script>

</body>
</html>
